{% include base_path %}
<aside class="dock" aria-label="About and links">
  <img class="dock__thumb" src="{{ base_path }}/images/portrait.jpg" alt="Hans W. A. Hanley" width="626" height="720">
  <div class="dock__body">
    <p class="dock__standfirst">
      {% for bit in site.data.profile.dateline %}<span>{{ bit }}</span>{% endfor %}
    </p>
    <span class="dock__head">Links</span>
    <ul>
      {% for l in site.data.links.dock %}
        <li><a{% if l.primary %} class="dock__cv"{% endif %} href="{{ l.url }}"><span class="dock__ico" aria-hidden="true">{{ l.icon }}</span>{{ l.title }}</a></li>
      {% endfor %}
    </ul>
  </div>
</aside>
