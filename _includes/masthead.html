{% include base_path %}
<header class="masthead">
  <h1 class="masthead__name"><a href="{{ base_path }}/">{{ site.title }}</a><span class="masthead__cn" lang="zh-Hans">汉斯·汉隶</span></h1>
</header>

<nav class="site">
  <ul>
    {% for link in site.data.navigation.main %}
      {% if link.url contains 'http' %}
        <li><a class="ext" href="{{ link.url }}">{{ link.title }}</a></li>
      {% else %}
        <li><a href="{{ base_path }}{{ link.url }}"{% if page.url == link.url %} aria-current="page"{% endif %}>{{ link.title }}</a></li>
      {% endif %}
    {% endfor %}
    <li class="nav__toggle">
      <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Switch colour theme">Dark</button>
    </li>
  </ul>
</nav>
