{%- comment -%} Google Scholar citation metadata for publication pages {%- endcomment -%}
<meta name="citation_title" content="{{ page.title | strip_html }}">
<meta name="citation_author" content="Hanley, Hans W. A.">
{% if page.date %}<meta name="citation_publication_date" content="{{ page.date | date: '%Y/%m/%d' }}">{% endif %}
{% if page.venue %}<meta name="citation_conference_title" content="{{ page.venue }}">{% endif %}
{% if page.paperurl %}<meta name="citation_pdf_url" content="{{ page.paperurl }}">{% endif %}
