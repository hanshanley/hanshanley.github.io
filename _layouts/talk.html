---
layout: default
---
{% include base_path %}
<div class="prose">
  <h2>{{ page.title }}</h2>
  <p class="record__authors">
    {% if page.venue %}{{ page.venue }}{% endif %}{% if page.location %}, {{ page.location }}{% endif %}
    {% if page.date %} · {{ page.date | date: "%B %-d, %Y" }}{% endif %}
  </p>
  {{ content }}
  <p><a href="{{ base_path }}/talks/">← All talks</a></p>
</div>
